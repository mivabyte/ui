name: Propose shadcn/ui upstream sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "shadcn-ui/ui ref to compare with the pinned baseline"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: shadcn-upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    name: Detect upstream changes and open a draft PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pushes the generated sync branch
      pull-requests: write # opens the draft sync pull request
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate a fail-closed sync proposal
        id: proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref || 'main' }}
        run: |
          npm run sync:upstream -- --target "$TARGET_REF" --write-proposal
          if git diff --quiet -- docs/upstream/pending-sync.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update draft sync PR
        if: steps.proposal.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/shadcn-upstream-sync
          delete-branch: true
          draft: true
          commit-message: "chore: propose shadcn/ui upstream sync"
          title: "chore: review shadcn/ui upstream sync"
          body: |
            ## Automated upstream detection

            This draft PR was generated from the scheduled shadcn/ui base-registry comparison.

            - It **does not overwrite component source**.
            - It **does not advance the pinned baseline SHA**.
            - It **does not publish `@mivabyte/ui`**.

            Review `docs/upstream/pending-sync.md`, adapt only the intended source changes, update the baseline and parity records, then run the full package verification before marking this PR ready.
          add-paths: |
            docs/upstream/pending-sync.md
