name: Consumer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vite React 19
            script: scripts/test-app-consumer.mjs
            args: vite-react-19
            cache_path: |
              package-lock.json
              fixtures/vite-react-19/package-lock.json
          - name: Next App Router
            script: scripts/test-app-consumer.mjs
            args: next-app-router
            cache_path: |
              package-lock.json
              fixtures/next-app-router/package-lock.json
          - name: SSR Imports
            script: scripts/check-packed-ssr.mjs
            args: ""
            cache_path: package-lock.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: ${{ matrix.cache_path }}
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - name: Run ${{ matrix.name }} consumer contract
        # Passed through the environment rather than interpolated into the
        # script: a `${{ matrix.args }}` inside `run:` is shell code, so adding
        # one matrix row with a substitution would execute on the runner.
        env:
          CONSUMER_SCRIPT: ${{ matrix.script }}
          CONSUMER_ARGS: ${{ matrix.args }}
        run: node "$CONSUMER_SCRIPT" $CONSUMER_ARGS
