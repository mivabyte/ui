name: Dependency Review

# `npm audit` in the verify matrix reports every known advisory, including ones
# this repository already accepts. This gate only looks at what a pull request
# *introduces*, so a Dependabot bump that pulls in a new advisory or a license
# the project does not want is rejected instead of silently inherited.
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "fixtures/**/package.json"
      - "fixtures/**/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Required by `comment-summary-in-pr`, which the pinned action documents
      # as needing this scope to post its report.
      pull-requests: write # posts the dependency review summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          show-patched-versions: true
          show-openssf-scorecard: true
          # The advisory snapshot occasionally lags the published database and
          # reports snapshot warnings that are not real findings.
          retry-on-snapshot-warnings: true
