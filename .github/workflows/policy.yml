name: Release policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Verify release intent
        # The SHAs are passed through the environment, not interpolated into the
        # script body, so a malformed value cannot become shell code.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/check-release-policy.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
